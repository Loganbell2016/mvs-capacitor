workflows:
  ios-debug-sim: {name: Simulator debug, max_build_duration: 30, environment: {xcode: latest}, scripts: [{name: Run in simulator, script: "bash debug/sim.sh"}], artifacts: [out/launch1.png, out/launch2.png, out/stdout1.txt, out/stdout2.txt]}
  ios-distribution:
    name: Munfordville Sports iOS
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.munfordvillesports.app"
        APP_STORE_APP_ID: "6836411892"
      xcode: latest
      cocoapods: default
      ios_signing: {distribution_type: app_store, bundle_identifier: com.munfordvillesports.app}
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install typescript
      - name: Add iOS platform
        script: |
          npx cap add ios
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set bundle ID
        script: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.munfordvillesports.app;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || true
      - name: Apply MVS app fixes
        script: |
          cat ios-patch/MVSApp.swift >> ios/App/App/AppDelegate.swift
          sed -i '' 's/rootViewController = CAPBridgeViewController()/rootViewController = MVSViewController()/' ios/App/App/SceneDelegate.swift
          sed -i '' 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="MVSViewController" customModule="App" customModuleProvider="target"/' ios/App/App/Base.lproj/Main.storyboard
          /usr/libexec/PlistBuddy -c "Delete :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneStoryboardFile" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Delete :UIMainStoryboardFile" ios/App/App/Info.plist || true
          grep -c MVSViewController ios/App/App/SceneDelegate.swift
      - name: Set app icon
        script: |
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          sips -s format png --cropToHeightWidth 948 948 ios-patch/514412664_1296806425781103_2023976538211842074_n.jpg --out /tmp/i1.png
          sips -z 880 880 /tmp/i1.png --out /tmp/i2.png
          sips --padToHeightWidth 1024 1024 --padColor FFFFFF /tmp/i2.png --out /tmp/i3.png
          sips -s format jpeg -s formatOptions 100 /tmp/i3.png --out /tmp/i4.jpg
          sips -s format png /tmp/i4.jpg --out "$ICON"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON"
      - name: Fetch and use code signing files
        script: |
          xcode-project use-profiles
      - name: Create export options
        script: |
          cat > ios/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>7482Q28KY4</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
      - name: Build iOS archive
        script: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath ios/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=MANUAL \
            DEVELOPMENT_TEAM=7482Q28KY4
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath ios/App.xcarchive \
            -exportOptionsPlist $HOME/export_options.plist \
            -exportPath ios/ipa_output
    artifacts:
      - ios/ipa_output/*.ipa
      - ios/App.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
