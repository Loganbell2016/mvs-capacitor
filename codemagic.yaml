workflows:
  ios-distribution:
    name: Munfordville Sports iOS
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.munfordvillesports.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.munfordvillesports.app"
        APP_STORE_APP_ID: "6836411892"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Add iOS platform
        script: |
          npx cap add ios
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set bundle ID
        script: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.munfordvillesports.app;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Create export options
        script: |
          cat > ios/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>7482Q28KY4</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
      - name: Build iOS archive
        script: |
          xcode-project use-profiles
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath ios/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=AUTOMATIC \
            DEVELOPMENT_TEAM=7482Q28KY4
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath ios/App.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath ios/ipa_output
    artifacts:
      - ios/ipa_output/*.ipa
      - ios/App.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_days: 1
